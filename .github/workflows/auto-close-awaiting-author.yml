# Close issues labeled awaiting-author when the reporter does not reply within a grace period.
# Maintainers: add awaiting-author after a fix ships. The next daily run posts one notice (or
# updates it) asking the reporter to react with 👍 if the fix works. 👍 closes the issue; any other
# author comment clears the label and leaves it open; silence closes after ~n days.
# The rules live in scripts/awaiting-author.js.

name: Auto-close awaiting author

on:
  schedule:
    # Daily ~1pm US Eastern (17:00 UTC)
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      grace_days:
        description: Days to wait after awaiting-author before closing
        required: false
        default: "4"
        type: string

permissions:
  issues: write

jobs:
  close-awaiting-author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const {
              LABEL_NAME,
              NOTICE_MARKER,
              parseGraceDays,
              labeledAtFromTimeline,
              decide,
            } = require(`${process.env.GITHUB_WORKSPACE}/scripts/awaiting-author.js`);

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const graceDays = parseGraceDays(
              context.payload.inputs?.grace_days ?? "4"
            );
            if (graceDays == null) {
              core.setFailed(
                `Invalid grace_days: ${context.payload.inputs?.grace_days}`
              );
              return;
            }

            async function removeLabel(issueNumber) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  name: LABEL_NAME,
                });
              } catch {
                // Label may already be gone.
              }
            }

            async function closeIssue(issueNumber, body) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issueNumber,
                state: "closed",
                state_reason: "completed",
              });
              await removeLabel(issueNumber);
            }

            try {
              await github.rest.issues.getLabel({
                owner,
                repo,
                name: LABEL_NAME,
              });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: LABEL_NAME,
                  color: "FBCA04",
                  description:
                    "Fix may be ready; no reply in ~4 days—we assume resolved and close.",
                });
              } else {
                throw error;
              }
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: LABEL_NAME,
              per_page: 100,
            });

            for (const issue of issues) {
              if (issue.pull_request) continue;

              const issueNumber = issue.number;
              const author = issue.user?.login;
              if (!author) continue;

              const timeline = await github.paginate(
                github.rest.issues.listEventsForTimeline,
                { owner, repo, issue_number: issueNumber, per_page: 100 }
              );
              const labeledAt = labeledAtFromTimeline(timeline);
              if (labeledAt == null) continue;

              const { data: comments } = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: issueNumber,
                since: new Date(labeledAt).toISOString(),
                per_page: 100,
              });

              const noticeComment = comments.find((comment) =>
                comment.body?.includes(NOTICE_MARKER)
              );
              const reactions = noticeComment
                ? await github.paginate(github.rest.reactions.listForIssueComment, {
                    owner,
                    repo,
                    comment_id: noticeComment.id,
                    per_page: 100,
                  })
                : [];

              const actions = decide({
                author,
                comments,
                reactions,
                labeledAt,
                now: Date.now(),
                graceDays,
              });

              for (const action of actions) {
                if (action.type === "update-notice") {
                  await github.rest.issues.updateComment({
                    owner,
                    repo,
                    comment_id: action.commentId,
                    body: action.body,
                  });
                } else if (action.type === "post-notice") {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    body: action.body,
                  });
                } else if (action.type === "remove-label") {
                  await removeLabel(issueNumber);
                } else if (action.type === "close") {
                  await closeIssue(issueNumber, action.body);
                }
              }
            }
