name: Feature Request
description: Suggest a new feature or improvement for GitBoba
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest an improvement. Please fill in as much detail as you can.

  - type: textarea
    id: motivation
    attributes:
      label: What's the motivation?
      description: A problem you're facing, a missing capability, or an improvement you'd find valuable.
      placeholder: Describe what's missing or what would make GitBoba more useful.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the feature you'd like
      description: A clear description of what you want to happen.
      placeholder: It would be great if GitBoba could…
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any workarounds or other approaches you've tried or thought about.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, links, or anything else that helps explain the request.
    validations:
      required: false
